name: Sync upstream and deploy to Cloudflare

on:
  schedule:
    # GitHub cron is UTC. 18:45 UTC = 02:45 Asia/Shanghai the next day.
    - cron: "45 18 * * *"
  workflow_dispatch:
    inputs:
      initialize_jwt_secret:
        description: "Create/rotate JWT_SECRET after deployment (select only for first setup)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nodewarden-production
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    name: Sync upstream, verify, and deploy
    if: github.repository == 'danndee1/nodewarden'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${GH_REPO}/merge-upstream" -f branch=main

      - name: Checkout synchronized main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run i18n:validate
          npm run test:config-compatibility

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy KV configuration to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Initialize JWT secret
        if: github.event_name == 'workflow_dispatch' && inputs.initialize_jwt_secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: openssl rand -hex 32 | npx wrangler secret put JWT_SECRET